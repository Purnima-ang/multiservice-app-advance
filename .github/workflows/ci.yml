        #     cd /path/to/your/app # Navigate to your application directory on the server
        #     docker login -u ${{ secrets.DOCKERHUB_USERNAME }} -p ${{ secrets.DOCKERHUB_TOKEN }}
        #     docker-compose pull web # Pull the latest web image
        #     docker-compose up -d --no-deps web # Start or update the web service, avoiding restarting redis
